name: KAEL Music APK Builder

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Check project ZIP
    run: |
      test -f KAEL_Music_Fresh_Android_Project.zip || {
        echo "Project ZIP not found in repository root"
        exit 1
      }

  - name: Extract Android project
    run: |
      unzip -o KAEL_Music_Fresh_Android_Project.zip -d project
      test -f project/kael-fresh/settings.gradle

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build KAEL Music APK
    run: |
      gradle --no-daemon -p project/kael-fresh assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: KAEL-Music-APK
      path: project/kael-fresh/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
